<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Read Documents</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <span class="navbar-brand mb-0 h1">Read Documents</span>
    <a class="btn btn-outline-light btn-sm" th:href="@{/dashboard}">&larr; Dashboard</a>
</nav>

<div class="container-fluid py-4">
    <div class="row">
        <div class="col-md-6">
            <div class="card border-primary mb-4">
                <div class="card-header bg-primary text-white">Read all documents in a schema</div>
                <div class="card-body">
                    <form method="post" th:action="@{/read/all}">
                        <div class="form-row">
                            <div class="form-group col">
                                <label>Database</label>
                                <input type="text" class="form-control" name="database" th:value="${f_database}" required/>
                            </div>
                            <div class="form-group col">
                                <label>Schema</label>
                                <input type="text" class="form-control" name="schema" th:value="${f_schema}" required/>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Read All</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card border-info mb-4">
                <div class="card-header bg-info text-white">Read one document by id</div>
                <div class="card-body">
                    <form method="post" th:action="@{/read/one}">
                        <div class="form-row">
                            <div class="form-group col">
                                <label>Database</label>
                                <input type="text" class="form-control" name="database" th:value="${f_database}" required/>
                            </div>
                            <div class="form-group col">
                                <label>Schema</label>
                                <input type="text" class="form-control" name="schema" th:value="${f_schema}" required/>
                            </div>
                            <div class="form-group col">
                                <label>Id</label>
                                <input type="text" class="form-control" name="id" th:value="${f_id}" required/>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-info btn-block">Read One</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <p th:if="${readError}" class="alert alert-danger" th:text="${readError}"></p>

    <!-- single document -->
    <div class="card mb-4" th:if="${single != null}">
        <div class="card-header">Document <span class="badge badge-dark" th:text="${singleId}"></span></div>
        <div class="card-body">
            <pre class="mb-0" style="white-space:pre-wrap" th:text="${single}"></pre>
        </div>
    </div>

    <!-- all documents -->
    <div class="card" th:if="${docs != null}">
        <div class="card-header">
            All documents
            <span class="badge badge-secondary" th:text="${count} + ' doc(s)'"></span>
        </div>
        <div class="card-body">
            <p th:if="${count == 0}" class="text-muted">No documents.</p>
            <table class="table table-sm table-striped" th:if="${count > 0}">
                <thead><tr><th style="width:90px">Id</th><th>Document</th></tr></thead>
                <tbody>
                <tr th:each="entry : ${docs}">
                    <td><span class="badge badge-dark" th:text="${entry.key}"></span></td>
                    <td><pre class="mb-0" style="white-space:pre-wrap" th:text="${entry.value}"></pre></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
