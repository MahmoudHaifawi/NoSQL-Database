<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Read &middot; NoSQL Cluster</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="nc-body">

<nav th:replace="fragments/layout :: navbar('read')"></nav>

<div class="container-fluid pb-5">
    <div class="row">
        <div class="col-md-6">
            <div class="card border-primary mb-4">
                <div class="card-header bg-primary text-white">Read all documents in a schema</div>
                <div class="card-body">
                    <form method="post" th:action="@{/read/all}">
                        <div class="form-row">
                            <div class="form-group col">
                                <label>Database</label>
                                <input type="text" class="form-control" name="database" th:value="${f_database}" required/>
                            </div>
                            <div class="form-group col">
                                <label>Schema</label>
                                <input type="text" class="form-control" name="schema" th:value="${f_schema}" required/>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Read All</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card border-info mb-4">
                <div class="card-header bg-info text-white">Read one document by id</div>
                <div class="card-body">
                    <form method="post" th:action="@{/read/one}">
                        <div class="form-row">
                            <div class="form-group col">
                                <label>Database</label>
                                <input type="text" class="form-control" name="database" th:value="${f_database}" required/>
                            </div>
                            <div class="form-group col">
                                <label>Schema</label>
                                <input type="text" class="form-control" name="schema" th:value="${f_schema}" required/>
                            </div>
                            <div class="form-group col">
                                <label>Id</label>
                                <input type="text" class="form-control" name="id" th:value="${f_id}" required/>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-info btn-block">Read One</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <p th:if="${readError}" class="alert alert-danger" th:text="${readError}"></p>

    <!-- single document -->
    <div class="card mb-4" th:if="${single != null}">
        <div class="card-header d-flex align-items-center">
            <span>Document <span class="badge badge-dark" th:text="${singleId}"></span></span>
            <span class="nc-served ml-auto" th:if="${currentNode}" th:text="'served by ' + ${currentNode}"></span>
        </div>
        <div class="card-body">
            <pre class="nc-doc" th:text="${single}"></pre>
        </div>
    </div>

    <!-- all documents -->
    <div class="card" th:if="${docs != null}">
        <div class="card-header d-flex align-items-center">
            <span>All documents <span class="badge badge-secondary" th:text="${count} + ' doc(s)'"></span></span>
            <span class="nc-served ml-auto" th:if="${currentNode}" th:text="'served by ' + ${currentNode}"></span>
        </div>
        <div class="card-body">
            <p th:if="${count == 0}" class="text-muted mb-0">No documents.</p>
            <table class="table table-sm table-striped mb-0" th:if="${count > 0}">
                <thead><tr><th style="width:90px">Id</th><th>Document</th></tr></thead>
                <tbody>
                <tr th:each="entry : ${docs}">
                    <td><span class="badge badge-dark" th:text="${entry.key}"></span></td>
                    <td><pre class="nc-doc" th:text="${entry.value}"></pre></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
