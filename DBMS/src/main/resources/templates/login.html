<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign in &middot; NoSQL Cluster</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="nc-body">

<div class="container" style="max-width:26rem">
    <div class="text-center mt-5 mb-3">
        <h3 class="font-weight-bold" style="color:var(--nc-brand)">NoSQL&nbsp;Cluster</h3>
        <p class="text-muted small mb-0">Distributed document store &mdash; gateway</p>
    </div>
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <p th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></p>
            <form action="#" th:action="@{/login}" th:object="${user}" method="post">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" class="form-control" th:field="*{username}" name="username"/>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" th:field="*{password}" name="password"/>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign in</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
