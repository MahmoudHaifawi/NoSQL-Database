<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard &middot; NoSQL Cluster</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="nc-body">

<nav th:replace="fragments/layout :: navbar('dashboard')"></nav>

<div class="container-fluid pb-5">

    <!-- Cluster topology -->
    <div class="card mb-4">
        <div class="card-header bg-white d-flex align-items-center">
            <strong>Cluster topology</strong>
            <span class="nc-explainer ml-3">
                The bootstrapping node load-balances each user to one data node; writes replicate to all peers.
            </span>
        </div>
        <div class="card-body">
            <p th:if="${topologyError}" class="text-muted mb-0" th:text="${topologyError}"></p>
            <p th:if="${nodes != null and nodes.isEmpty()}" class="text-muted mb-0">No nodes configured.</p>
            <div class="nc-topology" th:if="${nodes != null and !nodes.isEmpty()}">
                <div class="nc-node-card" th:each="n : ${nodes}" th:classappend="${n.current} ? 'nc-current'">
                    <span class="nc-dot" th:classappend="${n.up} ? 'nc-dot-up' : 'nc-dot-down'"></span>
                    <div>
                        <div class="nc-node-name" th:text="${n.name} + ':' + ${n.port}">Node0:8080</div>
                        <div class="nc-node-sub" th:text="${n.up} ? 'reachable' : 'unreachable'">reachable</div>
                    </div>
                    <span class="nc-pin ml-auto" th:if="${n.current}">your node</span>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- Create database -->
        <div class="col-md-6 mb-4">
            <div class="card h-100">
                <div class="card-header bg-primary text-white">Create new database</div>
                <div class="card-body">
                    <form method="post" th:action="@{/admin/createDatabase}" th:object="${database}">
                        <div class="form-group">
                            <label for="databaseName">Database name</label>
                            <input type="text" id="databaseName" class="form-control" name="databaseName"
                                   th:field="*{name}" placeholder="e.g. shop"/>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Create database</button>
                        <p th:if="${databaseError}" th:text="${databaseError}" class="text-danger mt-2 mb-0"></p>
                    </form>
                </div>
            </div>
        </div>
        <!-- Add user -->
        <div class="col-md-6 mb-4">
            <div class="card h-100">
                <div class="card-header bg-primary text-white">Add new user</div>
                <div class="card-body">
                    <form method="post" th:action="@{/admin/addUser}" th:object="${user}">
                        <div class="form-group">
                            <label for="userName">Username</label>
                            <input type="text" id="userName" class="form-control" name="userName"
                                   th:field="*{username}" placeholder="Username"/>
                        </div>
                        <div class="form-group">
                            <label for="userPassword">Password</label>
                            <input type="text" id="userPassword" class="form-control" name="userPassword"
                                   th:field="*{password}" placeholder="Password"/>
                        </div>
                        <div class="form-group">
                            <label for="userRole">Role</label>
                            <input type="text" id="userRole" class="form-control" name="userRole"
                                   th:field="*{role}" placeholder="admin or user"/>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Add user</button>
                        <p th:if="${userError}" th:text="${userError}" class="text-danger mt-2 mb-0"></p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Create schema -->
    <div class="card mb-4">
        <div class="card-header bg-dark text-white">Create a schema</div>
        <div class="card-body">
            <form method="post" th:action="@{/createSchema}" th:object="${schema}">
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="schemaName">Schema name</label>
                        <input type="text" id="schemaName" class="form-control" name="schemaName"
                               th:field="*{schemaName}" placeholder="Schema name"/>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="dbName">Database name</label>
                        <input type="text" id="dbName" class="form-control" name="databaseName"
                               th:field="*{databaseName}" placeholder="Database name"/>
                    </div>
                </div>
                <div class="form-group">
                    <label for="schema">Schema (JSON)</label>
                    <textarea class="form-control text-monospace" id="schema" rows="8" name="schema" th:field="*{schema}"
                              placeholder='{
  "Name": "String",
  "Age": "Integer",
  "Married": "Boolean",
  "GPA": "Double"
}'></textarea>
                </div>
                <button type="submit" class="btn btn-dark">Create schema</button>
                <p th:if="${schemaMessage}" th:text="${schemaMessage}" class="text-success mt-2 mb-0"></p>
                <p th:if="${schemaError}" th:text="${schemaError}" class="text-danger mt-2 mb-0"></p>
            </form>
        </div>
    </div>

    <!-- Insert document -->
    <div class="card mb-4">
        <div class="card-header bg-dark text-white">Insert a document</div>
        <div class="card-body">
            <form method="post" th:action="@{/createDocument}">
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="docDbName">Database name</label>
                        <input type="text" id="docDbName" class="form-control" name="databaseName"
                               placeholder="Database name"/>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="docSchemaName">Schema name</label>
                        <input type="text" id="docSchemaName" class="form-control" name="schemaName"
                               placeholder="Schema name"/>
                    </div>
                </div>
                <div class="form-group">
                    <label for="documentBody">Document (JSON)</label>
                    <textarea class="form-control text-monospace" id="documentBody" rows="7" name="document"
                              placeholder='{
  "name": "Keyboard",
  "price": 30,
  "inStock": true
}'></textarea>
                </div>
                <button type="submit" class="btn btn-dark">Insert document</button>
                <p th:if="${documentMessage}" th:text="${documentMessage}" class="text-success mt-2 mb-0"></p>
                <p th:if="${documentError}" th:text="${documentError}" class="text-danger mt-2 mb-0"></p>
            </form>
        </div>
    </div>

</div>
</body>
</html>
